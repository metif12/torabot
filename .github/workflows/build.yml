name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs the unit tests on every platform the project targets. Each file is
  # built and run separately: building them together in one v invocation can
  # fail in libgc, and the resulting exec failed (SetHandleInformation) says
  # nothing about the real problem. See the README.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        shell: bash
        run: ./scripts/ci/install-v.sh

      - name: V version
        run: v version

      - name: Tests
        run: ./scripts/test.sh

  # Builds a native binary for the runner's platform. Cross-compiling from a
  # single host would need a full per-target C toolchain, including a
  # cross-built libgc; building natively avoids that and produces binaries
  # known to run on the platform they were produced for.
  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        shell: bash
        run: ./scripts/ci/install-v.sh

      - name: Normalise architecture name
        id: arch
        run: |
          case "$(uname -m)" in
            x86_64) echo "name=amd64" ;;
            aarch64 | arm64) echo "name=arm64" ;;
            *) echo "name=$(uname -m)" ;;
          esac

      - name: Build
        run: ./scripts/build.sh linux "${{ steps.arch.outputs.name }}"

      # An MCP server speaks JSON-RPC on stdio and prints nothing on startup,
      # so the check is that it answers a frame rather than crashing on load.
      - name: Smoke test the binary
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | timeout 20 "./dist/torabot-linux-${{ steps.arch.outputs.name }}" \
            | grep -q '"serverInfo"'

      - uses: actions/upload-artifact@v4
        with:
          name: torabot-linux-${{ steps.arch.outputs.name }}
          path: dist/

  # The Windows binary is cross-compiled from Linux rather than built on a
  # Windows runner: makev.bat fails there with "SetHandleInformation: The handle
  # is invalid", and V's own TCC handles the Windows target from Linux. The
  # smoke test then runs under wine, so the artifact is still verified rather
  # than merely produced.
  build-windows:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        shell: bash
        run: ./scripts/ci/install-v.sh

      - name: Build windows/amd64
        run: ./scripts/build.sh windows amd64

      - name: Install wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32 wine64

      - name: Smoke test under wine
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | timeout 90 wine ./dist/torabot-windows-amd64.exe \
            | grep -q '"serverInfo"'

      - uses: actions/upload-artifact@v4
        with:
          name: torabot-windows-amd64
          path: dist/

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        shell: bash
        run: ./scripts/ci/install-v.sh

      - name: Normalise architecture name
        id: arch
        run: |
          case "$(uname -m)" in
            x86_64) echo "name=amd64" ;;
            aarch64 | arm64) echo "name=arm64" ;;
            *) echo "name=$(uname -m)" ;;
          esac

      - name: Build
        run: ./scripts/build.sh macos "${{ steps.arch.outputs.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: torabot-macos-${{ steps.arch.outputs.name }}
          path: dist/