name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish under, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  # Each platform builds on a runner that can produce it. Windows is
  # cross-compiled from Linux: makev.bat fails on Windows runners with
  # "SetHandleInformation: The handle is invalid", and V's TCC handles the
  # Windows target from Linux.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        shell: bash
        run: ./scripts/ci/install-v.sh

      - name: Build and package
        shell: bash
        run: |
          set -eu
          arch="$(uname -m)"
          case "$arch" in
            x86_64) arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
          esac
          ./scripts/build.sh "${{ matrix.platform }}" "$arch" dist
          cd dist
          base="torabot-${{ matrix.platform }}-$arch"
          tar -czf "$base.tar.gz" "$base"
          shasum -a 256 "$base.tar.gz" > "$base.tar.gz.sha256"
          cat "$base.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        shell: bash
        run: ./scripts/ci/install-v.sh

      - name: Build
        shell: bash
        run: ./scripts/build.sh windows amd64 dist

      - name: Package
        shell: bash
        run: |
          cd dist
          zip -q -r torabot-windows-amd64.zip torabot-windows-amd64.exe
          sha256sum torabot-windows-amd64.zip > torabot-windows-amd64.zip.sha256
          cat torabot-windows-amd64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/

  publish:
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/**
          generate_release_notes: true
          body: |
            ## torabot ${{ github.event.inputs.tag || github.ref_name }}

            A Discord MCP server written in V. No Node.js, no Python, no external
            dependencies.

            ### Install

            Download the archive for your platform, extract it, then point your
            MCP client at the binary:

            ```json
            {
              "mcpServers": {
                "discord": {
                  "command": ["/path/to/torabot"],
                  "environment": { "DISCORD_TOKEN": "your-bot-token" }
                }
              }
            }
            ```

            See the [README](https://github.com/${{ github.repository }}) for
            bot setup, including the Message Content Intent that message reading
            requires.

            ### Verifying a download

            Each archive has a matching `.sha256` file:

            ```
            sha256sum -c torabot-linux-amd64.tar.gz.sha256   # linux
            shasum -a 256 -c torabot-macos-arm64.tar.gz.sha256   # macos
            ```

            ### Building on Windows

            Use the `.exe` directly. The Linux and macOS builds are separate
            binaries; there is no single cross-platform executable.